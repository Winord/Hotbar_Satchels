org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# =====================================================================================
# Check https://fabricmc.net/develop/ before first build and verify these versions.
# =====================================================================================
minecraft_version=26.1.2

# Fabric Loader is largely version-independent; use the latest stable release.
loader_version=0.19.3

# Fabric API is pinned to a specific Minecraft version.
fabric_api_version=0.155.3+26.1.2

# Fabric Loom Gradle plugin version.
# Bumped from 1.15.1 -> 1.16.2: 1.15.1's bundled class-tweaker reader only understands
# "classTweaker v1" headers. One of our dependency jars now ships a "classTweaker v2"
# file (the v2 header is required for the enum-extension feature, Loom 1.16+ only),
# and Loom 1.15.1 throws "Unsupported class tweaker format: v2" while rebuilding its
# Minecraft-jar cache and reading every mod's access widener / class tweaker file.
# 1.16.2 (June 2026) adds v2 support. Gradle 9.7.1 (see gradle-wrapper.properties)
# already satisfies Loom 1.16's Gradle 9.0+ requirement, so no wrapper bump needed.
loom_version=1.16.2

# MixinExtras: explicit dependency required for @Expression/@Definition in mixins.
mixinextras_api_version=0.5.5

# =====================================================================================
# Mod Properties
# =====================================================================================
mod_id=satchels
mod_name=Hotbar Satchels
mod_version=1.1
mod_license=MIT

mod_group_id=net.hotbar
mod_authors=Winord
mod_description=Equippable satchels providing extra hotbar storage.

# =====================================================================================
# Optional mod integrations ? versions pinned to Fabric 26.1.x builds.
# ALWAYS verify on Modrinth / respective mavens before writing these into a new port.
# =====================================================================================

# Trinkets Updated (replaces Accessories on 26.x). Maven: maven.nucleoid.xyz/releases
# Artifact: eu.pb4:trinkets ? verify at https://maven.nucleoid.xyz/#/releases/eu/pb4/trinkets
# ARCHIVED on 26.1.x (upstream slot-id desync bug) — see docs/accessory-compat-roadmap.md.
# Still built against (modCompileOnly/modLocalRuntime only, not bundled) so TrinketsCompat.java
# keeps compiling for a quick re-enable on the 26.2 port.
trinkets_version=4.0.0+26.1

# Ohmega — active satchel-accessory compat on 26.1.x while Trinkets is archived (see
# docs/accessory-compat-roadmap.md). OhmegaCompat.java is a real, verified implementation
# (checked against this exact jar via javap/CFR — see that class's javadoc), not a scaffold.
# 1.5.21+26.1.2 is the stable 1.5.x line (not the unstable 1.6.0-beta.x line, which also
# targets 26.1/26.1.2 separately — do not accidentally pin the beta).
ohmega_version=1.5.21

# Ohmega's own hard dependency (fabric.mod.json: "forgeconfigapiport": ">=26.1") — required for
# Ohmega to initialize at all (ConfigRegistry.INSTANCE.register call in Ohmega's ModInitializer).
# Only needed here for modCompileOnly/modLocalRuntime (dev-run testing); not a real player ever
# lacks it once Ohmega is installed, since Fabric Loader refuses to load Ohmega without it — so
# it does NOT need to go in our own fabric.mod.json suggests/depends.
# 26.1.5 is the latest release on the "26.1.x" maintenance branch (project by Fuzs) — the
# 26.1.3 release notes explicitly state "Supports 26.1-26.1.2 Fabric", matching our pinned
# minecraft_version above; 26.2.x is a separate, incompatible primary branch — don't pin that.
forgeconfigapiport_version=26.1.5

# JEI ? 29.x branch covers 26.1 / 26.1.1 / 26.1.2; 30.x covers 26.2.
jei_version=29.34.0.90

# Raised ? verify latest build for 26.1.x at https://modrinth.com/mod/raised/versions
raised_version=Fabric-26.1.1-5.1.2

# Cloth Config ? [Fabric 26.1] v26.1.154 build confirmed in port-decisions doc.
cloth_config_version=26.1.154

# Mod Menu ? verify latest major for 26.1 at https://modrinth.com/mod/modmenu/versions
modmenu_version=18.0.0