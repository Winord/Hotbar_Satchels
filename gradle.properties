# Still archived on 26.2 (SatchelsCompat.TRINKETS.shouldLoad stays false) - see
# satchels-port-decisions-26_2.md §2. The beta this comment previously referenced has since
# been superseded by a full 4.1.0+26.2 RELEASE (checked 2026-09-18, verified directly against
# the release jar's bytecode) - it has both eu.pb4.trinkets.api.TrinketSlotUtils and the whole
# eu.pb4.trinkets.api.event.* package (TrinketCanUnequipCallback, TrinketEquipmentChangedCallback,
# etc.), matching TrinketsCompat's imports exactly. Whether the upstream slot-id/visual-position
# desync bug is actually fixed in this release is still NOT confirmed either way (no changelog
# text found mentioning it) - do not flip shouldLoad without checking that separately.
trinkets_version=4.1.0+26.2
# 1.5.21 DOES have a Fabric 26.2 build after all (Swackyy/Ohmega branch 26.2.x, modV=1.5.21) -
# the previous comment here was wrong. Verified directly against the release jar's bytecode:
# com.swacky.ohmega.api.{AccessoryHelper,IAccessory} match OhmegaCompat's imports exactly, no
# code changes needed. CAUTION: Ohmega republishes the same version_number "1.5.21" for the
# 26.1.2, 26.2 AND 26.3 Fabric builds (confirmed via CurseForge's file listing, checked
# 2026-09-18) - maven.modrinth:ohmega:1.5.21 is therefore ambiguous and may resolve to whichever
# of those three was published most recently (currently the 26.3 one), not necessarily the 26.2
# jar this project was built against. See build.gradle: Ohmega is pinned as a local file
# dependency instead of a maven coordinate specifically to avoid this.
ohmega_version=1.5.21
forgeconfigapiport_version=26.2.1

