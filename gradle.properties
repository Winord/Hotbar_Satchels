org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# =====================================================================================
# Check https://fabricmc.net/develop/ before first build and verify these versions.
# =====================================================================================
minecraft_version=26.1.2

# Fabric Loader is largely version-independent; use the latest stable release.
loader_version=0.19.3

# Fabric API is pinned to a specific Minecraft version.
fabric_api_version=0.155.3+26.1.2

# Fabric Loom Gradle plugin version.
loom_version=1.15.1

# MixinExtras: explicit dependency required for @Expression/@Definition in mixins.
mixinextras_api_version=0.5.5

# =====================================================================================
# Mod Properties
# =====================================================================================
mod_id=satchels
mod_name=Hotbar Satchels
mod_version=1.1
mod_license=MIT

mod_group_id=net.hotbar
mod_authors=Winord
mod_description=Equippable satchels providing extra hotbar storage.

# =====================================================================================
# Optional mod integrations ? versions pinned to Fabric 26.1.x builds.
# ALWAYS verify on Modrinth / respective mavens before writing these into a new port.
# =====================================================================================

# Trinkets Updated (replaces Accessories on 26.x). Maven: maven.nucleoid.xyz/releases
# Artifact: eu.pb4:trinkets ? verify at https://maven.nucleoid.xyz/#/releases/eu/pb4/trinkets
trinkets_version=4.0.0+26.1

# JEI ? 29.x branch covers 26.1 / 26.1.1 / 26.1.2; 30.x covers 26.2.
jei_version=29.34.0.90

# Raised ? verify latest build for 26.1.x at https://modrinth.com/mod/raised/versions
raised_version=Fabric-26.1.1-5.1.2

# Cloth Config ? [Fabric 26.1] v26.1.154 build confirmed in port-decisions doc.
cloth_config_version=26.1.154

# Mod Menu ? verify latest major for 26.1 at https://modrinth.com/mod/modmenu/versions
modmenu_version=18.0.0