org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# =====================================================================================
# Minecraft / Fabric toolchain
# =====================================================================================
minecraft_version=26.1.2
loader_version=0.19.3
fabric_api_version=0.155.3+26.1.2

# Loom 1.16.2 required: 1.15.1 can't read the "classTweaker v2" header some deps ship
# (enum-extension feature). 1.15.1 fails with "Unsupported class tweaker format: v2".
loom_version=1.16.2

mixinextras_api_version=0.5.5

# =====================================================================================
# Mod Properties
# =====================================================================================
mod_id=satchels
mod_name=Hotbar Satchels
mod_version=1.1
mod_license=MIT

mod_group_id=net.hotbar
mod_authors=Winord
mod_description=Equippable satchels providing extra hotbar storage.

# =====================================================================================
# Optional mod integrations — versions pinned to Fabric 26.1.x builds.
# Verify on Modrinth / respective mavens before reusing these for a new port.
# =====================================================================================

# Trinkets Updated — archived on 26.1.x (upstream slot-id desync bug, see
# satchels-port-decisions-26_1.md §10). Still built against so TrinketsCompat.java keeps
# compiling for re-enable on 26.2.
trinkets_version=4.0.0+26.1

# Ohmega — active satchel-accessory compat on 26.1.x while Trinkets is archived.
# 1.5.21+26.1.2 is the stable 1.5.x line — do not accidentally pin 1.6.0-beta.x.
ohmega_version=1.5.21

# Ohmega's own hard dependency. Only needed here for dev-run testing (modCompileOnly/
# modLocalRuntime) — not required in our own fabric.mod.json, since Loader refuses to
# load Ohmega without it anyway.
# 26.1.x maintenance branch only — 26.2.x is a separate, incompatible primary branch.
forgeconfigapiport_version=26.1.5

# JEI 29.x covers 26.1 / 26.1.1 / 26.1.2; 30.x covers 26.2.
jei_version=29.34.0.90

raised_version=Fabric-26.1.1-5.1.2
cloth_config_version=26.1.154
modmenu_version=18.0.0
