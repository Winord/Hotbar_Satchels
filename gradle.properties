org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# =====================================================================================
# Check https://fabricmc.net/develop/ before first build and verify these versions.
# =====================================================================================
minecraft_version=1.21.4

# Fabric Loader is largely version-independent; use the latest stable release.
loader_version=0.16.10

# Fabric API is pinned to a specific Minecraft version.
fabric_api_version=0.119.4+1.21.4

# Fabric Loom Gradle plugin version.
# NOTE: verify this still resolves for 1.21.4 on first real ./gradlew build in this
# environment (no network access here to Fabric's Maven to confirm compatibility) -
# bump to 1.10.x if Loom itself fails to resolve/apply.
loom_version=1.9.2

# MixinExtras and explicit dependency required for @Expression/@Definition in mixins.
mixinextras_api_version=0.5.4

# =====================================================================================
# Mod Properties
# =====================================================================================
mod_id=satchels
mod_name=Hotbar Satchels
mod_version=1.1
mod_license=MIT

mod_group_id=net.hotbar
mod_authors=Winord
mod_description=Equippable satchels providing extra hotbar storage.

# =====================================================================================
# Optional mod integrations and versions pinned to Fabric 1.21.4 builds.
# Verify on Modrinth/CurseForge when updating to a new MC version.
#
# JEI и EMI: no Fabric build exists for 1.21.4 at all (JEI dropped Fabric/Forge support
# for this version specifically - NeoForge only; EMI hasn't been updated past 1.21.1 on
# any loader). Both integrations are fully disabled for this build - see build.gradle
# (dependencies commented out) and SatchelsJEIPlugin.java / SatchelsEMIPlugin.java
# (excluded from compilation) and fabric.mod.json (entrypoints removed). Re-enable when
# porting to 1.21.5+, where JEI Fabric support returns.
#
# Raised: no Fabric build exists for 1.21.4 either (only Forge/NeoForge got 4.0.1 for
# 1.21.2-1.21.4; Fabric jumped straight from 1.21.1 to 1.21.6). Kept as a compile-only
# stub pinned to the last real Fabric artifact so RaisedCompat.java still compiles - not
# bundled at runtime. Safe because every RaisedApi call in RaisedCompat.java is guarded
# by SatchelsCompat.RAISED.isLoaded(), which will just stay false. Re-enable as a normal
# modImplementation when porting to 1.21.6+.
# =====================================================================================
accessories_version=1.2.19-beta+1.21.4
raised_version=Fabric-1.21.1-5.0.0
cloth_config_version=17.0.144
modmenu_version=13.0.4
