# Re-enabled on 26.2 (SatchelsCompat.TRINKETS.shouldLoad back to plain mod-presence) - see
# satchels-port-decisions-26_2.md §2. Superseded a full 4.1.0+26.2 RELEASE (checked 2026-09-18,
# verified directly against the release jar's bytecode) - it has both
# eu.pb4.trinkets.api.TrinketSlotUtils and the whole eu.pb4.trinkets.api.event.* package
# (TrinketCanUnequipCallback, TrinketEquipmentChangedCallback, etc.), matching TrinketsCompat's
# imports exactly. The 4.1.0-rc.1+26.2 changelog text (confirmed 2026-09-18) explicitly says it
# "[r]eworked Trinket slot logic to no [longer] split the slot ids from visual position of
# slots... preventing slot id desyncs" - matches our 26.1.x bug description directly, so treated
# as fixed. Still worth a real in-game equip/reload smoke test before shipping, since no issue
# tracker post explicitly confirms *this* satchel-specific symptom was the same root cause.
trinkets_version=4.1.0+26.2
# 1.5.21 DOES have a Fabric 26.2 build after all (Swackyy/Ohmega branch 26.2.x, modV=1.5.21) -
# the previous comment here was wrong. Verified directly against the release jar's bytecode:
# com.swacky.ohmega.api.{AccessoryHelper,IAccessory} match OhmegaCompat's imports exactly, no
# code changes needed. CAUTION: Ohmega republishes the same version_number "1.5.21" for the
# 26.1.2, 26.2 AND 26.3 Fabric builds (confirmed via CurseForge's file listing, checked
# 2026-09-18) - maven.modrinth:ohmega:1.5.21 is therefore ambiguous and may resolve to whichever
# of those three was published most recently (currently the 26.3 one), not necessarily the 26.2
# jar this project was built against. See build.gradle: Ohmega is pinned as a local file
# dependency instead of a maven coordinate specifically to avoid this.
ohmega_version=1.5.21
forgeconfigapiport_version=26.2.1

