plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "hotbar-${mod_id}-fabric"
}

repositories {
    mavenLocal()
    mavenCentral()

    exclusiveContent { // Modrinth
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }

    maven { // Trinkets Updated — required transitive deps
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven { // Trinkets Updated — Yumi Framework
        name = "Ladysnake"
        url = "https://maven.ladysnake.org/releases"
    }

    maven { // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven { // Cloth Config, Mod Menu
        url = "https://maven.shedaniel.me/"
    }

    maven { // Mod Menu
        url = "https://maven.terraformersmc.com/"
    }
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/main/generated"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings line — Minecraft 26.1+ ships an unobfuscated jar; Loom 1.15 detects this
    // automatically and rejects officialMojangMappings() in that environment.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Trinkets Updated — replaces Accessories on 26.x (Accessories has no Fabric build on 26.x).
    // MIT licence, author Patbox. modId = "trinkets_updated"
    implementation "eu.pb4:trinkets:${trinkets_version}"

    implementation "maven.modrinth:raised:${raised_version}"

    // JEI — optional integration; compile against API only, runtime for dev runs
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // EMI removed — development stopped at 1.21.1 (archived in emi-compat-archive/).

    // Mod Menu — compile-only; implements ModMenuApi for config screen registration
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // MixinExtras — bundled into the jar; needed for @Expression/@Definition in mixins
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixinextras_api_version}")))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}