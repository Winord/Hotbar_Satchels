plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "hotbar-${mod_id}-fabric"
}

repositories {
    mavenLocal()
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake"
        url = "https://maven.ladysnake.org/releases"
    }

    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        url = "https://maven.shedaniel.me/"
    }
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        datagen {
            client()
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/main/generated"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 26.1+ ships an unobfuscated jar — no mappings line; Loom (1.16 on 26.1.x, 1.17 on
    // 26.2) detects this and rejects officialMojangMappings() here.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Archived for 26.1.x (upstream desync bug — see satchels-port-decisions-26_1.md §10).
    // compileOnly/localRuntime only: not bundled, players don't need it installed.
    compileOnly "eu.pb4:trinkets:${trinkets_version}"
    localRuntime "eu.pb4:trinkets:${trinkets_version}"

    // Active satchel-accessory compat while Trinkets is archived.
    // Pinned as a local file, NOT "maven.modrinth:ohmega:${ohmega_version}" — Ohmega reuses the
    // same version_number "1.5.21" across its 26.1.2, 26.2 and 26.3 Fabric builds (confirmed via
    // CurseForge's file listing), so that coordinate is ambiguous and can silently resolve to the
    // wrong Minecraft-version build. The jar in libs/ has been verified directly against 26.2's
    // decompiled classes (com.swacky.ohmega.api.{AccessoryHelper,IAccessory} match OhmegaCompat's
    // imports exactly) — see gradle.properties. Swap back to the maven coordinate once Ohmega's
    // publishing gets a real version_id/classifier per Minecraft version, or once satisfied the
    // ambiguous coordinate resolves correctly in this environment.
    compileOnly files("libs/ohmega-${ohmega_version}+26.2.jar")
    localRuntime files("libs/ohmega-${ohmega_version}+26.2.jar")

    // Ohmega's own hard dependency — without it Ohmega's ModInitializer crashes on startup.
    compileOnly "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}-fabric"
    localRuntime "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}-fabric"

    implementation "maven.modrinth:raised:${raised_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // EMI removed — development stopped at 1.21.1, no Fabric build past it.

    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixinextras_api_version}")))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    // Forces toolchain resolution to find a JDK 25 regardless of which JVM launched the
    // Gradle daemon — without this, `options.release = 25` above just asserts against
    // whatever `java` started gradlew, and fails on an older JVM even if JDK 25 exists.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}
