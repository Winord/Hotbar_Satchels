plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "hotbar-${mod_id}-fabric"
}

repositories {
    mavenLocal()
    mavenCentral()

    exclusiveContent { // Modrinth
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/"
    }

    maven { // Trinkets Updated — required transitive deps
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven { // Trinkets Updated — Yumi Framework
        name = "Ladysnake"
        url = "https://maven.ladysnake.org/releases"
    }

    maven { // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven { // Cloth Config, Mod Menu
        url = "https://maven.shedaniel.me/"
    }

    maven { // Mod Menu
        url = "https://maven.terraformersmc.com/"
    }
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        datagen {
            client()
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/main/generated"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings line — Minecraft 26.1+ ships an unobfuscated jar; Loom 1.15 detects this
    // automatically and rejects officialMojangMappings() in that environment.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Trinkets Updated — archived for 26.1.x (see docs/accessory-compat-roadmap.md and
    // SatchelsCompat's class javadoc): a known upstream slot-id/visual-position desync bug in
    // the 4.0.x+26.1 line, only fixed via the rework that shipped alongside Trinkets' own 26.2
    // port. TrinketsCompat.java stays in the codebase, dormant (SatchelsCompat.TRINKETS
    // .shouldLoad is hardcoded false). Softened from a hard `implementation` to
    // `compileOnly`/`localRuntime` — the satchel no longer requires players to install
    // Trinkets Updated at all, since its integration doesn't activate. localRuntime keeps it
    // available for `./gradlew runClient`/`runServer` dev testing without bundling it into the
    // built jar. MIT licence, author Patbox. modId = "trinkets_updated"
    // NOTE: plain `compileOnly`/`localRuntime`, not `modCompileOnly`/`modLocalRuntime` — 26.1
    // ships an unobfuscated jar, so Loom dropped remapping (and the `mod`-prefixed configs
    // that trigger it) entirely; see https://docs.fabricmc.net/develop/porting/.
    compileOnly "eu.pb4:trinkets:${trinkets_version}"
    localRuntime "eu.pb4:trinkets:${trinkets_version}"

    // Ohmega — active satchel-accessory compat for 26.1.x, replacing Trinkets while the above
    // is archived (see docs/accessory-compat-roadmap.md). OhmegaCompat.java is a real,
    // verified implementation (checked against this exact jar via javap/CFR decompilation —
    // see that class's javadoc for what was confirmed and why). MODID = "ohmega".
    compileOnly "maven.modrinth:ohmega:${ohmega_version}"
    localRuntime "maven.modrinth:ohmega:${ohmega_version}"

    // Ohmega's own hard dependency — without it Ohmega's ModInitializer throws registering its
    // config spec, so runClient/runServer would crash even though this isn't our mod's own
    // dependency. See gradle.properties for why this doesn't need to appear in fabric.mod.json.
    compileOnly "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}-fabric"
    localRuntime "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}-fabric"

    implementation "maven.modrinth:raised:${raised_version}"

    // JEI — optional integration; compile against API only, runtime for dev runs
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // EMI removed — development stopped at 1.21.1 (archived in emi-compat-archive/).

    // Mod Menu — compile-only; implements ModMenuApi for config screen registration
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // MixinExtras — bundled into the jar; needed for @Expression/@Definition in mixins
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixinextras_api_version}")))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    // Without this, `options.release = 25` above just asserts against whatever JVM happens
    // to have started the Gradle daemon (JAVA_HOME / PATH `java` at the time `gradlew` was
    // invoked) — if that JVM is older than 25, javac fails immediately with
    // "error: release version 25 not supported", even on a machine that has a JDK 25
    // installed elsewhere. This block makes Gradle's toolchain resolution actively search
    // for (not download — no network needed if it's already installed) a JDK 25 to compile
    // with, independent of which JVM launched the daemon.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}