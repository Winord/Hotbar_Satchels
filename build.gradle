plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "hotbar-${mod_id}-fabric"
}

repositories {
    mavenLocal()
    mavenCentral()

    exclusiveContent { // Modrinth
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven { // Accessories
        name = "Wisp Forest"
        url = "https://maven.wispforest.io/releases"
    }
    maven { // Accessories transitive dep (endec)
        name = "su5ed"
        url = "https://maven.su5ed.dev/releases"
    }
    maven { // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { // EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven { // Cloth Config
        url = "https://maven.shedaniel.me/"
    }
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            runDir "build/datagen"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/main/generated"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "io.wispforest:accessories-fabric:${accessories_version}"
    modImplementation "maven.modrinth:raised:${raised_version}"

    // JEI — optional integration; compile against API only, runtime for dev runs
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    // EMI — optional integration; uses :api classifier
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modRuntimeOnly "dev.emi:emi-fabric:${emi_version}"

    // Mod Menu — compile-only; implements ModMenuApi for config screen registration
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // MixinExtras — bundled into the jar; needed for @Expression/@Definition in mixins
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixinextras_api_version}")))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}
